<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de Clientes • Gerencia Valle</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="/pilares/delivery/clientes/styles.css" />
</head>
<body>

  <button id="togglePanel" class="togglePanel" type="button">
    CONTROLES
  </button>

  <div class="panel" id="panel">

    <div class="header-panel">
      <h2 class="panel-title">LOCALIZADOR DPO</h2>
      <p class="panel-subtitle">GERENCIA VALLE</p>
    </div>

    <!-- BÚSQUEDA INDIVIDUAL -->
    <div class="fila">
      <select id="cd" title="Selecciona CD">
        <option value="">Cargando CDs...</option>
      </select>

      <input
        type="text"
        id="codigo"
        placeholder="Código Cliente"
      />

      <button id="buscar" class="btn-main">
        BUSCAR
      </button>

      <div id="estado" class="badge-estado"></div>
    </div>

    <hr class="divider" />

    <!-- BÚSQUEDA MÚLTIPLE -->
    <div class="fila multi-search-block">

      <label class="section-label">
        BÚSQUEDA MÚLTIPLE
      </label>

      <textarea
        id="codigosManual"
        rows="4"
        placeholder="Ejemplo:
100234
100567
100890"
      ></textarea>

      <button id="btnMostrarManual">
        VISUALIZAR CLIENTES
      </button>

    </div>

    <!-- LIMPIAR -->
    <div class="fila action-block">
      <button id="btnLimpiar" class="btn-outline">
        LIMPIAR MAPA
      </button>
    </div>

  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/pilares/delivery/clientes/app.js"></script>

</body>
</html>
