<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Cumplimiento Gerencial - Valle</title>
    <link rel="stylesheet" href="/css/dashboard.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="main-header">
            <h1>Monitor de Cumplimiento Gerencial</h1>
            <div class="filters-bar">
                <select id="filtroCD" onchange="cargarDataDashboard()">
                    <option value="TODOS">Todos los CD's</option>
                    <option value="Cali">Cali</option>
                    <option value="Yumbo">Yumbo</option>
                    <option value="Popayan">Popayán</option>
                    <option value="Tulua">Tuluá</option>
                </select>

                <select id="filtroTipo" onchange="cargarDataDashboard()">
                    <option value="TODOS">Tipo: Todos</option>
                    <option value="Novedad">Reporte de ruta</option>
                    <option value="5 Porqués">Gestión del día anterior</option>
                </select>

                <select id="filtroEstado" onchange="cargarDataDashboard()">
                    <option value="TODOS">Estado: Todos</option>
                    <option value="Pendiente">🔴 Pendientes</option>
                    <option value="Realizado">🟢 Realizado</option>
                    <option value="No ejecutado">🟡 No ejecutado</option>
                </select>

                <div class="filter-date-wrapper">
                    <input type="date" id="filtroFecha" onchange="cargarDataDashboard()" class="input-date-premium">
                </div>
            </div>
        </header>

        <section class="kpi-grid">
            <div class="kpi-stats">
                <div class="stat-box blue">
                    <span id="totalNovedades">0</span>
                    <p>🚚 Novedades</p>
                </div>
                <div class="stat-box yellow">
                    <span id="totalPorques">0</span>
                    <p>🤝 5 Porqués</p>
                </div>
                <div class="stat-box red">
                    <span id="totalPendientes">0</span>
                    <p>⚠️ Pendientes</p>
                </div>
            </div>
        </section>

        <section id="seccion-graficas" class="charts-section">
            <div class="chart-container">
                <h3 class="chart-title">📊 Tendencia por CD</h3>
                <canvas id="chartPorCD"></canvas> 
            </div>
            <div class="chart-container">
                <h3 class="chart-title">Top 5 Placas con más Novedades</h3>
                <canvas id="chartTopPlacas"></canvas>
            </div>
        </section>

        <section class="auditoria-section">
            <h3 class="section-title">📑 Módulo de Auditoría y Gestión</h3>
            <div class="table-responsive">
                <table id="tablaAuditoria">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>CD</th>
                            <th>Placa</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="modalGestion" class="modal">
        <div class="modal-content">
            <header class="modal-header">
                <h3>⚙️ Gestionar Reporte</h3>
                <p id="infoReporte"></p>
            </header>

            <div id="contenedorDetalleOriginal" class="original-desc">
                <label>📋 DESCRIPCIÓN ORIGINAL:</label>
                <p id="detalleTextoOriginal"></p>
            </div>

            <div class="form-group">
                <label>📝 Comentario de Gestión</label>
                <textarea id="comentarioGestion" placeholder="Ej: Se realizó feedback con la tripulación..."></textarea>
            </div>

            <div class="form-group">
                <label>📌 Cambiar Estado</label>
                <select id="nuevoEstado">
                    <option value="Pendiente">🔴 Pendiente</option>
                    <option value="Realizado">🟢 Realizado</option>
                    <option value="No ejecutado">🟡 No ejecutado</option>
                </select>
            </div>

            <div class="modal-actions">
                <button onclick="guardarGestion()" class="btn-save">💾 Guardar Cambios</button>
                <button onclick="cerrarModal()" class="btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/js/dashboard-ejecutivo.js?v=2"></script>
</body>
</html>
