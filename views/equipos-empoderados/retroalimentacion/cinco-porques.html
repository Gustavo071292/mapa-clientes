<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramienta 5 Porqués - IA DPO</title>
    <link rel="stylesheet" href="/css/cinco-porques.css?v=2">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h2>2.2.1 Herramienta de Gestión (5 Porqués)</h2>
                <p style="color: #aaa;">Análisis de Causa Raíz asistido por IA - Gerencia Valle</p>
            </div>
        </header>

        <form id="formCincoPorques">
            <div class="paso-box" style="border-left: 5px solid #c8102e; background: #252525;">
                <label style="color: white; font-weight: bold;">🚩 Descripción de la Novedad / Incidente</label>
                <textarea id="novedad_principal" rows="2" placeholder="Ej: Cliente de tienda la mejor, demora mucho la tripulacion..." required></textarea>
            </div>

            <div class="paso-box">
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label>📍 Centro de Distribución (CD)</label>
                        <select id="cd" name="cd" required onchange="actualizarPlacas()" style="width: 100%;">
                            <option value="">Seleccione CD...</option>
                            <option value="Cali">Cali</option>
                            <option value="Popayan">Popayán</option>
                            <option value="Tulua">Tuluá</option>
                            <option value="Yumbo">Yumbo</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>🚚 Número de Transporte (SAP)</label>
                        <input type="text" id="transporte" placeholder="Ej: 8008577311" required style="width: 100%;">
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label>🚛 Placa del Vehículo</label>
                        <select id="placa" name="placa" required style="width: 100%;">
                            <option value="">Primero seleccione un CD...</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>📊 Indicador a Analizar</label>
                        <select id="indicador" onchange="verificarOtroIndicador()" required style="width: 100%;">
                            <option value="">Seleccione indicador...</option>
                            <option value="Rechazos">Rechazos</option>
                            <option value="Modulación">Modulación</option>
                            <option value="RMD">RMD</option>
                            <option value="Adherencia a Km">Adherencia a Km</option>
                            <option value="Adherencia a Tiempo">Adherencia a Tiempo</option>
                            <option value="PNP">PNP</option>
                            <option value="Cashless">Cashless</option>
                            <option value="TML">TML</option>
                            <option value="TR">TR (Tiempo en Ruta)</option>
                            <option value="TI">TI (Tiempo Interno)</option>
                            <option value="DQI">DQI (Calidad e Indicadores)</option>
                            <option value="Otro">Otro (Especificar)</option>
                            <option value="SAC Atribuibles UC">SAC Atribuibles UC</option>
                            <option value="Tiempo de atención en PDV">Tiempo de atención en PDV</option>
                            <option value="Adherencia al check-list">Adherencia al check-list</option>
                            <option value="Entrega en rangos">Entrega en rangos</option>
                            <option value="Cantidad de rutas mayor a 10 HR">Cantidad de rutas mayor a 10 HR</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="niveles-container">
                <div class="paso-box" id="nivel-1">
                    <label>1. ¿Por qué ocurrió la novedad?</label>
                    <input type="text" id="p1" required placeholder="Escriba o use la IA" oninput="mostrarSiguienteNivel(1)">
                    <button type="button" class="btn-ia" onclick="consultarIA(1)">✨ Sugerencias IA</button>
                    <div id="ia-res-1" class="ia-assistant" style="display:none;"></div>
                </div>

                <div class="paso-box" id="nivel-2" style="display: none;">
                    <label>2. ¿Por qué ocurrió lo anterior?</label>
                    <input type="text" id="p2" oninput="mostrarSiguienteNivel(2)">
                    <button type="button" class="btn-ia" onclick="consultarIA(2)">✨ Sugerencias IA</button>
                    <div id="ia-res-2" class="ia-assistant" style="display:none;"></div>
                </div>

                <div class="paso-box" id="nivel-3" style="display: none;">
                    <label>3. ¿Por qué ocurrió lo anterior?</label>
                    <input type="text" id="p3" oninput="mostrarSiguienteNivel(3)">
                    <button type="button" class="btn-ia" onclick="consultarIA(3)">✨ Sugerencias IA</button>
                    <div id="ia-res-3" class="ia-assistant" style="display:none;"></div>
                </div>

                <div class="paso-box" id="nivel-4" style="display: none;">
                    <label>4. ¿Por qué ocurrió lo anterior?</label>
                    <input type="text" id="p4" oninput="mostrarSiguienteNivel(4)">
                    <button type="button" class="btn-ia" onclick="consultarIA(4)">✨ Sugerencias IA</button>
                    <div id="ia-res-4" class="ia-assistant" style="display:none;"></div>
                </div>

                <div class="paso-box" id="nivel-5" style="display: none; border-bottom: 3px solid #f2c200;">
                    <label>5. Causa Raíz (Conclusión final)</label>
                    <input type="text" id="p5" oninput="mostrarSiguienteNivel(5)">
                    <button type="button" class="btn-ia" onclick="consultarIA(5)">✨ Sugerencias IA Final</button>
                    <div id="ia-res-5" class="ia-assistant" style="display:none;"></div>
                </div>
            </div>

            <div class="plan-accion-section" style="margin-top: 20px; padding: 20px; background: #1a1a1a; border-radius: 8px;">
                <label style="color: #f2c200; font-weight: bold;">📌 Plan de Acción Definido</label>
                <textarea id="plan_accion" rows="3" required placeholder="Describa las acciones correctivas..."></textarea>
                <div style="display: flex; gap: 15px; margin-top: 15px;">
                    <div style="flex: 1;">
                        <label>👤 Responsable</label>
                        <input type="text" id="responsable" placeholder="Nombre del responsable" required style="width: 100%;">
                    </div>
                    <div style="flex: 1;">
                        <label>📅 Fecha Compromiso</label>
                        <input type="date" id="fecha_compromiso" required style="width: 100%;">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-save" style="margin-top: 25px; width: 100%; padding: 15px; background: #c8102e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                💾 Guardar Análisis en MongoDB Atlas
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
    <script src="/js/cinco-porques.js"></script>
</body>
</html>
