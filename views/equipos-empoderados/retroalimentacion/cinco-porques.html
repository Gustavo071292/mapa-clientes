<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramienta 5 Porqués - IA DPO</title>
    <link rel="stylesheet" href="/css/cinco-porques.css?v=5">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h2>2.2.1 Herramienta de Gestión (5 Porqués)</h2>
                <p style="color: #aaa;">Análisis de Causa Raíz Guiado por IA - Gerencia Valle</p>
            </div>
        </header>

        <form id="formCincoPorques">
            <!-- Contexto Operativo -->
            <div class="paso-box" style="border-left: 5px solid #c8102e; background: #252525;">
                <label style="color: white; font-weight: bold;">🚩 Descripción de la Novedad / Incidente *</label>
                <textarea id="novedad_principal" rows="2" placeholder="Ej: Cliente de tienda La Mejor, demora mucho la tripulación..." required></textarea>
            </div>

            <div class="paso-box">
                <div class="grid-row">
                    <div class="grid-col">
                        <label>📍 Centro de Distribución (CD) *</label>
                        <select id="cd" name="cd" required onchange="actualizarPlacas()" style="width: 100%;">
                            <option value="">Seleccione CD...</option>
                            <option value="Cali">Cali</option>
                            <option value="Popayan">Popayán</option>
                            <option value="Tulua">Tuluá</option>
                            <option value="Yumbo">Yumbo</option>
                        </select>
                    </div>
                    <div class="grid-col">
                        <label>🚚 Número de Transporte (SAP)</label>
                        <input type="text" id="transporte" placeholder="Ej: 8008577311" style="width: 100%;">
                    </div>
                </div>

                <div class="grid-row" style="margin-top: 15px;">
                    <div class="grid-col">
                        <label>🚛 Placa del Vehículo</label>
                        <select id="placa" name="placa" style="width: 100%;">
                            <option value="">Primero seleccione un CD...</option>
                        </select>
                    </div>
                    <div class="grid-col">
                        <label>📊 Indicador a Analizar *</label>
                        <select id="indicador" onchange="verificarOtroIndicador()" required style="width: 100%;">
                            <option value="">Seleccione indicador...</option>
                            <option value="Rechazos">Rechazos</option>
                            <option value="Modulación">Modulación</option>
                            <option value="RMD">RMD</option>
                            <option value="Adherencia a Km">Adherencia a Km</option>
                            <option value="Adherencia a Tiempo">Adherencia a Tiempo</option>
                            <option value="PNP">PNP</option>
                            <option value="Cashless">Cashless</option>
                            <option value="TML">TML</option>
                            <option value="TR">TR (Tiempo en Ruta)</option>
                            <option value="TI">TI (Tiempo Interno)</option>
                            <option value="DQI">DQI (Calidad e Indicadores)</option>
                            <option value="Otro">Otro (Especificar)</option>
                            <option value="SAC Atribuibles UC">SAC Atribuibles UC</option>
                            <option value="Tiempo de atención en PDV">Tiempo de atención en PDV</option>
                            <option value="Adherencia al check-list">Adherencia al check-list</option>
                            <option value="Entrega en rangos">Entrega en rangos</option>
                            <option value="Cantidad de rutas mayor a 10 HR">Cantidad de rutas mayor a 10 HR</option>
                        </select>
                    </div>
                </div>
                <div id="campo_otro_indicador" style="display: none; margin-top: 15px;">
                    <label>Especifique otro indicador *</label>
                    <input type="text" id="otro_indicador_texto" placeholder="Nombre del indicador">
                </div>
            </div>

            <!-- Sección de Historial de Pasos Anteriores -->
            <div id="historial-preguntas-container" style="display: none;">
                <h3 style="color: var(--dpo-gold); font-size: 1rem; margin-bottom: 10px;">📋 Pasos Anteriores Registrados</h3>
                <div id="lista-historial-pasos"></div>
            </div>

            <!-- Interfaz de Pregunta Activa (Entrevista Guiada) -->
            <div class="paso-box active-question-box" id="pregunta-activa-box" style="border-left: 5px solid var(--dpo-gold); background: #222;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label id="etiqueta-pregunta-activa" style="color: var(--dpo-gold); font-weight: bold; margin:0;">Pregunta de análisis: ¿Por qué ocurrió la novedad?</label>
                    <span id="badge-estado-ia" class="badge-estado" style="display: none;"></span>
                </div>
                
                <!-- Feedback / Mensajes Inline (Sin alert) -->
                <div id="inline-msg-box" class="inline-msg" style="display: none; margin-bottom: 10px;"></div>

                <!-- Feedback / Evaluación de la IA -->
                <div id="ia-evaluacion-box" class="ia-assistant" style="display: none; margin-bottom: 12px;"></div>

                <!-- Input del Operador -->
                <textarea id="respuesta_actual_input" rows="3" placeholder="Escriba su respuesta aquí..." style="width: 100%;"></textarea>

                <!-- Opciones / Líneas de Investigación consultivas (No autocompletan directamente) -->
                <div id="ia-opciones-container" style="display: none; margin-top: 10px;">
                    <label style="font-size: 0.85em; color: #bbb; margin-bottom: 5px;">✨ Posibles líneas de investigación sugeridas por el copiloto (Toque para usar como referencia):</label>
                    <div id="lista-opciones-ia"></div>
                </div>

                <!-- Tarjeta de Posible Causa Raíz -->
                <div id="card-posible-causa" class="card-causa-raiz" style="display: none;">
                    <div style="font-weight: bold; color: var(--dpo-gold); margin-bottom: 5px;">🎯 Posible Causa Raíz Detectada</div>
                    <p id="texto-candidata-raiz" style="font-size: 0.95em; margin-bottom: 15px; color: #fff;"></p>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button type="button" class="btn-confirmar-raiz" onclick="confirmarCausaRaiz()">✅ Confirmar Causa Raíz</button>
                        <button type="button" class="btn-seguir-investigando" onclick="seguirInvestigandoDesdeCausaRaiz()">🔍 Seguir Investigando</button>
                    </div>
                </div>

                <!-- Botones de Acción de la Entrevista -->
                <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;" id="botones-accion-entrevista">
                    <button type="button" id="btn-analizar-ia" class="btn-ia" onclick="ejecutarAnalisisIA()" style="flex: 1; padding: 12px; font-weight: bold;">
                        ✨ Analizar con IA
                    </button>
                    <button type="button" id="btn-siguiente-nivel" class="btn-siguiente" onclick="avanzarSiguienteNivel()" style="flex: 1; padding: 12px; font-weight: bold; display: none;">
                        Siguiente Paso ➔
                    </button>
                </div>
            </div>

            <!-- Sección de Causa Raíz Confirmada y Plan de Acción (Bloqueada hasta confirmación) -->
            <div id="seccion-plan-accion" class="plan-accion-section" style="margin-top: 20px; opacity: 0.5; pointer-events: none;">
                <div style="background: rgba(200, 16, 46, 0.15); padding: 12px; border-radius: 6px; border: 1px solid var(--bavaria-red); margin-bottom: 15px;">
                    <span style="color: #f2c200; font-weight: bold;">🎯 Causa Raíz Confirmada:</span>
                    <p id="display-causa-confirmada" style="margin: 5px 0 0 0; font-style: italic; color: #fff;"></p>
                </div>

                <label style="color: #f2c200; font-weight: bold;">📌 Plan de Acción Definido *</label>
                <textarea id="plan_accion" rows="3" placeholder="Describa las acciones correctivas..."></textarea>
                
                <div class="grid-row" style="margin-top: 15px;">
                    <div class="grid-col">
                        <label>👤 Responsable *</label>
                        <input type="text" id="responsable" placeholder="Nombre del responsable" style="width: 100%;">
                    </div>
                    <div class="grid-col">
                        <label>📅 Fecha Compromiso *</label>
                        <input type="date" id="fecha_compromiso" style="width: 100%;">
                    </div>
                </div>

                <button type="submit" id="btn-guardar-atlas" class="btn-save" disabled style="margin-top: 25px; width: 100%; padding: 15px; background: #555; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: not-allowed;">
                    💾 Guardar Análisis en MongoDB Atlas
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
    <script src="/js/cinco-porques.js?v=5"></script>
</body>
</html>
