<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.1 Tablero Semanal | Zona Valle</title>
    <link rel="stylesheet" href="/css/desempeno-kpi.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bavaria-dark-theme">
    <div class="main-container">
        <header class="module-header">
            <div class="title-group">
                <h1><span class="module-number">1.1</span> Tablero Semanal PI y KPI</h1>
                <p>Visualización matricial de indicadores operativos - Zona Valle.</p>
            </div>
            <img src="/img/home_delivery/Zonavalle.png" alt="Zona Valle" class="corp-logo">
        </header>

        <section class="filter-panel card-glass">
            <div class="filter-group">
                <label>CD</label>
                <select id="filter-cd">
                    <option value="CALI">Cali</option>
                    <option value="POPAYAN">Popayán</option>
                    <option value="TULUA">Tuluá</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Año</label>
                <input type="number" id="filter-anio" value="2026">
            </div>
            <div class="filter-group">
                <label>Semana</label>
                <input type="number" id="filter-semana" placeholder="Ej: 14">
            </div>
            <div class="filter-group">
                <label>Cédula</label>
                <input type="text" id="filter-cedula" placeholder="10633471">
            </div>
            <div class="button-group">
                <button id="btn-consultar" class="btn-primary"><i class="fas fa-table"></i> Ver Tablero</button>
                <button id="btn-limpiar" class="btn-secondary">Limpiar</button>
            </div>
        </section>

        <div id="status-container" class="status-container"></div>

        <section id="executive-header" class="header-cards" style="display: none;">
            <div class="info-card">
                <span class="card-label">Colaborador</span>
                <span id="display-nombre" class="card-value">--</span>
            </div>
            <div class="info-card">
                <span class="card-label">Placa | Transporte</span>
                <span id="display-info-ruta" class="card-value">--</span>
            </div>
        </section>

        <div class="table-wrapper card-glass">
            <table id="weekly-table">
                <thead id="weekly-table-head"></thead>
                <tbody id="weekly-table-body">
                    <tr>
                        <td colspan="12" style="text-align:center; padding:50px; color:#666;">
                            <i class="fas fa-info-circle"></i> Complete los filtros para generar la matriz semanal.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/js/desempeno-kpi.js"></script>
</body>
</html>
